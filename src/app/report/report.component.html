<div class="heading">
  <h4 class="home-title">Preparation of Solutions and Common Reagents</h4>
</div>
<div class="card-container">
  <mat-card *ngFor="let item of data" class="example-card">
    <mat-card-header>
      <mat-card-title>{{ item.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ item.content }}</p>
    </mat-card-content>
  </mat-card>
</div>
